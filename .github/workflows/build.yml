name: Build Vibration
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          unzip -o -q "$ZIP"
          ls Vibration
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4
      - name: Build release APK
        working-directory: Vibration
        run: gradle :app:assembleRelease --no-daemon
      - name: Check size (under 15 MB)
        working-directory: Vibration
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          ls -l "$APK"
          [ $(stat -c%s "$APK") -lt 15728640 ] || { echo "APK over 15 MB"; exit 1; }
          cp "$APK" Vibration.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vibration
          path: Vibration/Vibration.apk
