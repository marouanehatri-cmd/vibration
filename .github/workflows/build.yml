name: Build Vibration
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Using $ZIP"
          unzip -o -q "$ZIP"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch engine (NewBlackbox)
        run: |
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git engine
          echo "Engine commit: $(git -C engine rev-parse HEAD)"
          echo "---- engine settings.gradle"
          cat engine/settings.gradle
      - name: Install NDK and platform
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "ndk;29.0.13846066" "platforms;android-34" "build-tools;34.0.0"
      - name: Add Vibration module to the engine build
        run: |
          cp -r Vibration/app engine/vibration
          printf "\ninclude ':vibration'\n" >> engine/settings.gradle
      - name: Build release APK
        working-directory: engine
        run: |
          chmod +x gradlew
          ./gradlew :vibration:assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        run: |
          APK=$(ls engine/vibration/build/outputs/apk/release/*.apk | head -1)
          ls -l "$APK"
          SIZE=$(stat -c%s "$APK")
          [ "$SIZE" -lt 15728640 ] || echo "::warning::APK is over 15 MB ($SIZE bytes)"
          cp "$APK" Vibration.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Vibration
          path: Vibration.apk
