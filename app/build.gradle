plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vibration.app'
    compileSdk 33
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.vibration.app"
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs.useLegacyPackaging = true
        pickFirst '**/libc++_shared.so'
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'

    // BlackBox: JitPack line (fill owner and tag) OR put the .aar in app/libs/
    // implementation 'com.github.OWNER:BlackBox:TAG'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])
}
